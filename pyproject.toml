[project]
name = "qstream-ha"
version = "0.1.0"
description = "Home Assistant integration for QStream ventilation fans"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant>=2025.4.4",
    "mypy>=1.18.2",
    "pytest>=8.3.5",
    "pytest-homeassistant-custom-component>=0.13.236",
    "qstream>=0.2.0",
    "ruff>=0.14.2",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = false
